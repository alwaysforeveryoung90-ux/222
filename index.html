<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>для тебя 💜</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: radial-gradient(circle at top, #2a0a4a 0%, #150525 40%, #000000 100%);
    background-attachment: fixed;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    color: #e0c8ff;
    padding: 50px 25px;
    display: flex;
    justify-content: center;
    overflow-x: hidden;
  }

  .text {
    max-width: 800px;
    width: 100%;
    font-size: 1.05rem;
    line-height: 1.9;
    color: #d8b4fe;
    text-align: left;
    word-wrap: break-word;
    text-shadow: 0 0 8px rgba(168, 85, 247, 0.35);
  }

  .text span {
    opacity: 0;
    animation: fadeIn 0.6s forwards;
  }

  @keyframes fadeIn {
    to { opacity: 1; }
  }

  .glow {
    position: fixed;
    width: 350px;
    height: 350px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(168, 85, 247, 0.25), transparent 70%);
    filter: blur(50px);
    pointer-events: none;
    z-index: -1;
  }
</style>
</head>
<body>

  <div class="glow" style="top: -100px; left: -100px;"></div>
  <div class="glow" style="bottom: -120px; right: -100px;"></div>

  <div class="text" id="text"></div>

<script>
  const phrases = [
    "дашуля",
    "киса",
    "я люблю тебя очень сильно",
    "не обижайся пожалуйста!! :3",
    "ценюю"
  ];

  const textEl = document.getElementById('text');

  // 500 фраз подряд, разделённых запятыми, всё с маленькой буквы
  let fullText = "";
  for (let i = 0; i < 500; i++) {
    fullText += phrases[i % phrases.length];
    if (i < 499) fullText += ", ";
  }

  // Разбиваем по символам для плавного появления
  const chars = fullText.split("");
  chars.forEach((ch, i) => {
    const span = document.createElement('span');
    span.textContent = ch;
    span.style.animationDelay = (i * 0.003) + "s";
    textEl.appendChild(span);
  });
</script>

</body>
</html>
