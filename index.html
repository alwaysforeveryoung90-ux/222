<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>5000 раз</title>
    <style>
        body {
            font-family: monospace;
            background: #000;
            color: #0f0;
            padding: 20px;
            font-size: 14px;
            line-height: 1.4;
        }
        p {
            margin: 0 0 4px 0;
            word-break: break-word;
        }
    </style>
</head>
<body>
    <div id="content"></div>

    <script>
        const phrase = "скинь сиськи";
        const total = 5000;
        const perLine = 50;
        const container = document.getElementById("content");

        for (let i = 0; i < total; i += perLine) {
            const p = document.createElement("p");
            const count = Math.min(perLine, total - i);
            p.textContent = Array(count).fill(phrase).join(" ");
            container.appendChild(p);
        }
    </script>
</body>
</html>
