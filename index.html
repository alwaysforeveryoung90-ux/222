<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Для Дашули 💖</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fbc2eb 100%);
    font-family: 'Segoe UI', Tahoma, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 30px 15px;
    overflow-x: hidden;
  }

  h1 {
    color: #fff;
    font-size: 2rem;
    text-shadow: 0 2px 10px rgba(255, 105, 180, 0.6);
    margin-bottom: 10px;
    text-align: center;
  }

  .subtitle {
    color: #fff;
    font-size: 1rem;
    opacity: 0.9;
    margin-bottom: 25px;
    text-align: center;
  }

  .button {
    background: #fff;
    color: #ff4d88;
    border: none;
    padding: 14px 32px;
    font-size: 1.1rem;
    font-weight: bold;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(255, 77, 136, 0.4);
    transition: transform 0.2s, box-shadow 0.2s;
    margin-bottom: 25px;
  }

  .button:hover {
    transform: translateY(-3px) scale(1.05);
    box-shadow: 0 10px 25px rgba(255, 77, 136, 0.6);
  }

  .button:active {
    transform: scale(0.98);
  }

  .container {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: center;
    max-width: 1100px;
    width: 100%;
  }

  .card {
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(6px);
    padding: 14px 20px;
    border-radius: 18px;
    color: #d6336c;
    font-size: 1rem;
    font-weight: 600;
    box-shadow: 0 4px 15px rgba(255, 105, 180, 0.25);
    opacity: 0;
    transform: translateY(20px) scale(0.8);
    animation: pop 0.5s forwards;
    cursor: default;
    transition: transform 0.2s, background 0.2s;
  }

  .card:hover {
    transform: scale(1.08) rotate(-2deg);
    background: #fff;
  }

  @keyframes pop {
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* сердечки на фоне */
  .heart {
    position: fixed;
    bottom: -40px;
    font-size: 24px;
    animation: floatUp linear forwards;
    pointer-events: none;
    z-index: 0;
  }

  @keyframes floatUp {
    to {
      transform: translateY(-110vh) rotate(360deg);
      opacity: 0;
    }
  }
</style>
</head>
<body>

  <h1>Дашуля 💖</h1>
  <p class="subtitle">100 признаний для самой любимой кисы</p>
  <button class="button" onclick="generate()">Показать 💌</button>
  <div class="container" id="container"></div>

<script>
  const phrases = [
    "дашуля 💕",
    "киса 🐱",
    "я люблю тебя очень сильно ❤️",
    "не обижайся пожалуйста!! :3",
    "ценюю 🥰"
  ];

  const container = document.getElementById('container');

  function generate() {
    container.innerHTML = '';

    for (let i = 0; i < 100; i++) {
      const card = document.createElement('div');
      card.className = 'card';
      card.textContent = phrases[i % phrases.length];
      card.style.animationDelay = (i * 0.03) + 's';
      container.appendChild(card);
    }

    // запускаем сердечки
    startHearts();
  }

  function startHearts() {
    const emojis = ['💖', '💕', '💗', '💓', '🌸', '✨', '💞'];
    for (let i = 0; i < 30; i++) {
      setTimeout(() => {
        const heart = document.createElement('div');
        heart.className = 'heart';
        heart.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        heart.style.left = Math.random() * 100 + 'vw';
        heart.style.fontSize = (16 + Math.random() * 24) + 'px';
        heart.style.animationDuration = (3 + Math.random() * 3) + 's';
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 6000);
      }, i * 100);
    }
  }
</script>

</body>
</html>
