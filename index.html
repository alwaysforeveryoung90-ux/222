<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>для тебя 💜</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: radial-gradient(circle at top, #2a0a4a 0%, #150525 40%, #000000 100%);
    background-attachment: fixed;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    color: #e0c8ff;
    padding: 60px 40px;
    display: flex;
    justify-content: center;
    overflow-x: hidden;
  }

  .columns {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 60px;
    max-width: 1000px;
    width: 100%;
  }

  .column {
    font-size: 1rem;
    line-height: 2;
    color: #d8b4fe;
    text-align: justify;
    word-wrap: break-word;
    text-shadow: 0 0 8px rgba(168, 85, 247, 0.35);
  }

  .glow {
    position: fixed;
    width: 350px;
    height: 350px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(168, 85, 247, 0.25), transparent 70%);
    filter: blur(50px);
    pointer-events: none;
    z-index: -1;
  }

  /* мобильная версия — один столбец */
  @media (max-width: 700px) {
    .columns {
      grid-template-columns: 1fr;
      gap: 0;
    }
    body { padding: 40px 20px; }
  }
</style>
</head>
<body>

  <div class="glow" style="top: -100px; left: -100px;"></div>
  <div class="glow" style="bottom: -120px; right: -100px;"></div>

  <div class="columns">
    <div class="column" id="col1"></div>
    <div class="column" id="col2"></div>
  </div>

<script>
  const phrases = [
    "дашуля",
    "киса",
    "я люблю тебя очень сильно",
    "не обижайся пожалуйста!! :3",
    "ценюю"
  ];

  // Собираем 500 фраз в один текст
  let parts = [];
  for (let i = 0; i < 500; i++) {
    parts.push(phrases[i % phrases.length]);
  }

  // Делим ровно пополам между двумя колонками
  const half = Math.ceil(parts.length / 2);
  const col1Text = parts.slice(0, half).join(", ") + ",";
  const col2Text = parts.slice(half).join(", ") + ",";

  document.getElementById("col1").textContent = col1Text;
  document.getElementById("col2").textContent = col2Text;
</script>

</body>
</html>
