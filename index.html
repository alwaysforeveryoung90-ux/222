<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мои слова для тебя 💜</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: radial-gradient(circle at top, #2a0a4a 0%, #150525 40%, #000000 100%);
    background-attachment: fixed;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    color: #e0c8ff;
    padding: 40px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
  }

  h1 {
    font-size: 2rem;
    background: linear-gradient(90deg, #c084fc, #a855f7, #7c3aed);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-align: center;
    margin-bottom: 10px;
    filter: drop-shadow(0 0 12px rgba(168, 85, 247, 0.6));
  }

  .subtitle {
    color: #b794f6;
    font-size: 0.95rem;
    margin-bottom: 35px;
    text-align: center;
    opacity: 0.85;
  }

  .container {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    max-width: 1200px;
    width: 100%;
  }

  .word {
    background: rgba(88, 28, 135, 0.35);
    border: 1px solid rgba(168, 85, 247, 0.35);
    padding: 10px 18px;
    border-radius: 14px;
    font-size: 0.95rem;
    color: #e9d5ff;
    box-shadow: 0 0 12px rgba(124, 58, 237, 0.25);
    opacity: 0;
    transform: translateY(15px);
    animation: fadeIn 0.4s forwards;
    transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
  }

  .word:hover {
    transform: translateY(-3px) scale(1.05);
    background: rgba(124, 58, 237, 0.55);
    box-shadow: 0 0 20px rgba(192, 132, 252, 0.8);
    color: #fff;
  }

  @keyframes fadeIn {
    to { opacity: 1; transform: translateY(0); }
  }

  .glow {
    position: fixed;
    width: 300px;
    height: 300px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(168, 85, 247, 0.25), transparent 70%);
    filter: blur(40px);
    pointer-events: none;
    z-index: -1;
  }
</style>
</head>
<body>

  <div class="glow" style="top: -80px; left: -80px;"></div>
  <div class="glow" style="bottom: -100px; right: -80px;"></div>

  <h1>Слова, которые я говорил тебе 💜</h1>
  <p class="subtitle">500 раз — потому что меньше не бывает</p>

  <div class="container" id="container"></div>

<script>
  // Базовые фразы
  const phrases = [
    "дашуля 💜",
    "киса 🐱",
    "я люблю тебя очень сильно ❤️",
    "не обижайся пожалуйста!! :3",
    "ценюю 🥰"
  ];

  const container = document.getElementById('container');

  // Генерируем ровно 500 слов/фраз
  for (let i = 0; i < 500; i++) {
    const el = document.createElement('div');
    el.className = 'word';
    el.textContent = phrases[i % phrases.length];
    el.style.animationDelay = (i * 0.01) + 's';
    container.appendChild(el);
  }
</script>

</body>
</html>
